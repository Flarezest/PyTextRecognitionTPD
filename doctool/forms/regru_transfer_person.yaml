# Заявление физлица о передаче права администрирования домена другому лицу (REG.RU)
#
# Для каждого поля задаются:
#   text   — регулярные выражения для PDF/DOCX с текстовым слоем (группа 1 = значение);
#            применяются по очереди, берётся первое совпадение;
#   scan   — где искать значение на скане: anchor — печатная подпись поля (несколько вариантов),
#            region — прямоугольник относительно найденной подписи:
#              dy0/dy1 — по вертикали, в высотах подписи от её верхнего края (минус = выше);
#              x0/x1   — по горизонтали, в долях ширины страницы;
#            block_start — (только для type: domains) начало абзаца со списком доменов: если список
#              многострочный, абзац распознаётся ещё раз отдельно (как есть и без подчёркиваний);
#   type   — как разбирать значение: text, fio, fio_date, fio_or_org, org, inn, passport, issuer, domains,
#            services, contact, date_words (реестр FIELD_PARSERS в doctool/application.py);
#   role   — смысл поля для проверок (doctool/formspec.py: ROLES), если имя поля с ним не совпадает.
#            Проверки, таблица интерфейса и выгрузка берут поле по роли: например, поле `fio_owner` с
#            `role: applicant_fio` будет сверяться с паспортом как «ФИО в тексте». Без role роль = имя поля.
#
# Уровень бланка:
#   labels_re      — печатные подписи под строками бланка в скобках («(кем выдан)»): вырезаются из значений
#                    (подписи всех бланков из forms/ — из значений любого бланка);
#                    регулярные выражения без скобок, «(…)» вокруг дописывается само;
#   strip_prefixes — печатные слова перед значением на скане («от», «Я,»): срезаются в начале значения;
#                    без этих ключей — прежние списки (как в 0.3.x), пустой список — ничего не вырезать;
#   rows           — (необязательно) свои строки таблицы интерфейса для полей, которых нет в стандартных:
#                    {id, title, app: [роли/поля], pas: поле паспорта или null, checks: [названия проверок]}.
#
# Новый бланк: скопируйте этот файл, поменяйте id, detect, поля; добавьте тип в config/case_types.yaml
# (form: <id>, checks: […]) и запустите python -m doctool validate — команда покажет ошибки в описании.
id: regru_transfer_person
title: Заявление физлица о передаче права администрирования домена (REG.RU)
# (0.7.0) Галка «Поля заявления — нейросетью»: поля читает локальная текстовая модель (doctool/llm_extract.py)
# по описаниям `llm:` вместо регулярок `text:`. llm_context — что это за документ, llm_example — пример ответа;
# `llm:` у поля — что выписать (модель возвращает дословную цитату, программа ищет её в тексте);
# `llm: false` — поле модель не читает; `digits: [12]` — сколько цифр должно быть в значении (иначе отбрасывается).
# Без галки работают регулярки `text:`; для нового бланка, который читается только нейросетью, их можно не писать.
llm_context: >-
  Заявление физического лица (текущего администратора домена) в ООО «Регистратор доменных имен РЕГ.РУ» о передаче
  права администрирования домена(ов) другому лицу — новому администратору. Бывает на бланке РЕГ.РУ, на бланке
  нотариуса или в свободной форме; к скану иногда приложены нотариальная надпись, опись, конверт.
llm_example: |-
  Текст: «от Иванова Петра Сергеевича, 01.02.1980 г.р. (ФИО, дата рождения) 4510 123456 выдан ОВД района Арбат
  г. Москвы 05.06.2010 (серия, номер паспорта, когда и кем выдан) … Заявление. Я, Иванов Пётр Сергеевич,
  прошу передать права по администрированию домена(ов) primer.ru, primer-dva.рф (наименование домена(ов))
  … новому Администратору: Наименование юр. лица ООО «Ромашка» e-mail/тел. info@romashka.ru, +7 495 123-45-67
  Для физ. лиц и ИП: ФИО e-mail/тел. Номер договора … профиля): 1234567/NIC-REG … / Иванов П. С. / (подпись)
  первое марта две тысячи двадцать шестого года (дата прописью)»
  Ответ (часть полей): {"applicant_header": "Иванова Петра Сергеевича, 01.02.1980",
  "passport": "4510 123456 … 05.06.2010", "issued_by": "ОВД района Арбат г. Москвы",
  "applicant_fio": "Иванов Пётр Сергеевич", "domains": ["primer.ru", "primer-dva.рф"],
  "new_admin_org": "ООО «Ромашка»", "new_admin_org_contact": "info@romashka.ru, +7 495 123-45-67",
  "new_admin_fio": "", "new_admin_contact": "", "contract": "1234567/NIC-REG", "signature_fio": "Иванов П. С.",
  "application_date": "первое марта две тысячи двадцать шестого года"}
# Постоянный текст бланка (не значения): по нему ограничиваются области значений на скане.
static_text:
  - "Генеральному директору"
  - "ООО «Регистратор доменных имен РЕГ.РУ»"
  - "зарегистрированного по адресу"
  - "прошу передать права по администрированию домена(ов)"
  - "и предоставляемых по этим доменам дополнительных услуг (при необходимости)"
  - "новому Администратору:"
  - "Номер договора (название аккаунта) нового администратора / партнера (с указанием"
detect:
  keywords: ["передаче права", "администрирования домена", "физического лица", "РЕГ.РУ", "новому Администратору",
             "прошу передать права по администрированию"]
  min_hits: 3
  # заголовок бланка: по нему страница заявления находится среди других страниц файла (конверт, опись, паспорт)
  title: ["о передаче права администрирования домена другому лицу", "Администратора домена - физического лица"]
  # признаки страницы-продолжения (вторая страница списка доменов, раздел «новому Администратору»)
  continuation: ["новому Администратору", "и предоставляемых по этим доменам", "(наименование домена", "(подпись)",
                 "(дата прописью)", "Номер договора"]
labels_re:
  - 'ФИО'
  - 'кем выдан'
  - 'адрес регистрации'
  - 'серия, номер паспорта, когда (?:и кем )?выдан'
  - 'ИНН ИП \(при наличии статуса ИП\)'
  - 'наименование домена\(ов\)?'
  - 'Primary, Secondary DNS'
  - 'номер договора с компанией РЕГ\.РУ'
  - 'фамилия, имя, отчество'
  - 'подпись'
  - 'дата прописью'
strip_prefixes:
  - 'от\b'
  - 'я,'
  - 'профиля\)\s*:'

# Раздел «новому Администратору» целиком (doctool/application.py: apply_new_admin_block). Нужен, когда у таблицы
# нового администратора OCR потерял подписи («Для физ.лиц и ИП:», «ФИО») или заявление в свободной форме.
# Из раздела берутся юрлицо (строка с ООО/АО/…), ФИО (2–4 слова, есть словарное имя или отчество), e-mail и телефоны.
# Значения полей нового администратора без признаков юрлица/ФИО/контакта считаются обрывками подписей и убираются.
new_admin_block:
  start: ['(?i)новому\s+Администратор[а-я]*\s*[:：]?']
  end: ['(?i)Номер\s+договора', '(?i)профиля\)', '(?i)[({]подпись[)}]', '(?m)^\s*Договор\s*№', '(?i)удостоверительная',
        '(?i)\(номер\s+договора', '(?i)\(дата\s+прописью']
  max_lines: 14

fields:
  applicant_header:
    title: ФИО заявителя (шапка) и дата рождения
    llm: >-
      ФИО заявителя и его дата рождения из шапки заявления (после «от …» или «от гражданина …»). Цитата от фамилии до даты рождения включительно (дата бывает цифрами или прописью, бывает на следующей строке); без паспортных данных и адреса.
    type: fio_date
    text:
      # «от» в начале строки (перед ним бывает оттиск штампа «ПОЛУЧЕНО»); ФИО, дата рождения и т. д. — до трёх
      # строк: дата рождения бывает на следующей строке («, д/р 13.03.1962»), прописью («27 апреля 1988 года»),
      # ФИО — с переносом («Джолдасовой⏎Анастасии Борисовны»). Разбор — тип fio_date (до паспортных данных).
      - '(?im)^[^\n]{0,25}?(?<![А-Яа-яЁё])от[ \t]+((?:граждан[а-я]*[ \t]+(?:Российской[ \t]+Федерации)?[ ,]*)?[А-ЯЁ_][^\n]*(?:\n[^\n]*){0,2})'
    scan:
      anchor: ["(ФИО, дата рождения)", "дата рождения)"]
      region: {dy0: -2.0, dy1: 0.05, x0: 0.53, x1: 1.0}

  inn:
    title: ИНН ИП
    llm: >-
      ИНН заявителя — 12 цифр — из его данных в шапке, рядом с ФИО, паспортом или адресом заявителя. Серия и номер паспорта (10 цифр, бывают слитно) — не ИНН. ИНН нового администратора сюда не относится. Нет — пусто.
    digits: [12]      # (нейросеть) у физлица и ИП ИНН — 12 цифр; иначе значение модели отбрасывается
    type: inn
    text:
      # только в шапке (до слова «Заявление», «прошу передать», «новому Администратору»): ниже — ИНН нового администратора
      - '(?is)\A(?:(?!\n\s*Заявление\s*\n|прошу\s+передать|новому\s+Администратор).)*?ИНН[^\d\n]{0,30}(\d{10,12})'
      - '(?is)\A(?:(?!\n\s*Заявление\s*\n|прошу\s+передать|новому\s+Администратор).)*?(?<![\d+])(\d{12})(?!\d)'
    scan:
      anchor: ["(ИНН ИП (при наличии статуса ИП))", "при наличии статуса ИП"]
      region: {dy0: -1.9, dy1: 0.05, x0: 0.53, x1: 1.0}

  passport:
    title: Серия, номер паспорта, дата выдачи
    llm: >-
      Серия и номер паспорта заявителя и дата его выдачи: цитата от серии и номера до даты выдачи включительно. Если между номером и датой стоит «кем выдан», перечисли номер и дату через « … ». Номер, ИНН, ОГРН нового администратора — не паспорт.
    type: passport
    text:
      # номер и до пяти строк после него: дата выдачи — после «Дата выдачи:» или первая дата после номера
      # (тип passport). Номер после «ИНН», «ОГРН», «КПП» — не паспорт.
      - '(?i)(?:паспорт|серия)[^\n\d]{0,40}(\d{2}\s?\d{2}\s?[№N]?\s?\d{6}(?!\d)[^\n]*(?:\n[^\n]*){0,5})'
      - '(?<![\d+])(?<!ИНН)(?<!ИНН )(?<!ИНН:)(?<!ИНН: )(?<!ОГРН )(?<!КПП )(\d{2}\s?\d{2}\s?[№N]?\s?\d{6}(?!\d)[^\n]*(?:\n[^\n]*){0,5})'
    scan:
      anchor: ["(серия, номер паспорта, когда выдан)", "номер паспорта, когда выдан"]
      region: {dy0: -1.9, dy1: 0.05, x0: 0.53, x1: 1.0}

  issued_by:
    title: Кем выдан паспорт
    llm: >-
      Кем выдан паспорт заявителя — название органа полностью, вместе с городом, районом, областью (например «ОВД Московского округа г. Калуга», «ОУФМС России по Омской обл. в Кировском АО г. Омска»), без даты выдачи, кода подразделения и подписи «(кем выдан)».
    type: issuer
    text:
      - '(?s)(?<![\d+])\d{2}\s?\d{2}\s?\d{6}(?!\d)(.+?)[({\[]кем выдан[)}\]]'
      # подпись «(серия, номер паспорта, когда и кем выдан)» — орган выдачи на тех же строках, что и номер
      - '(?s)(?<![\d+])\d{2}\s?\d{2}\s?\d{6}(?!\d)(.+?)[({\[]серия[^)}\]\n]*кем\s+выдан[)}\]]'
      # «Паспорт выдан: …», «Выдан: …» — до кода подразделения, даты выдачи, адреса
      - '(?is)\bвыдан\s*:\s*(.+?)\s*(?=\n\s*(?:Код\s+подразд|Дата\s+выдачи|Зарегистр|Адрес|\d{6}\b)|$)'
      - '(?s)(?<![\d+])\d{2}\s?\d{2}\s?[№N]?\s?\d{6}(?!\d)(.+?)(?:[Зз]арегистрированн|\n\s*Код\s+подразд)'
    scan:
      anchor: ["(кем выдан)"]
      region: {dy0: -2.0, dy1: 0.05, x0: 0.53, x1: 1.0}

  address:
    title: Адрес регистрации
    llm: >-
      Адрес регистрации заявителя (место жительства), полностью.
    type: text
    text:
      - '(?is)зарегистрированного\s+по\s+адресу:?\s*(.+?)\s*\(адрес регистрации\)'
      - '(?is)зарегистрированного\s+по\s+адресу:?\s*(.+?)\s*\n\s*Заявление'
      # свободная форма: «Зарегистрирован: …», «Адрес регистрации: …», «по месту жительства по адресу: …»
      - '(?is)(?:зарегистрирован[а-я]*(?:\s+по\s+месту\s+жительства)?(?:\s+по\s+адресу)?|Адрес\s+регистрации)\s*:\s*(.+?)\s*(?:\.\s*ИНН\b|\n\s*ЗАЯВЛЕНИЕ|\n\s*Заявление|\n\s*Я,|$)'
      # строка с почтовым индексом над подписью «(адрес регистрации)»
      - '(?s)\n([^\n]*\d{6}[^\n]*(?:\n[^\n(]*){0,2}?)\s*\(адрес регистрации\)'
    scan:
      anchor: ["(адрес регистрации)"]
      region: {dy0: -2.2, dy1: 0.05, x0: 0.53, x1: 1.0}

  applicant_fio:
    title: ФИО заявителя («Я, …»)
    llm: >-
      ФИО заявителя в основном тексте: строка вида «Я, Иванов Иван Иванович, прошу передать права …» — выпиши только ФИО (без «Я,» и без «прошу …»). Если фразы «Я, …» нет — пусто.
    type: fio
    text:
      # отчество бывает перенесено на следующую строку («Я, Тарасова Инесса⏎Александровна»);
      # лишнее («, прошу передать права…») отрезает тип fio
      - '(?m)\bЯ,[ \t]*_*([^\n(]+(?:\n[ \t]*[А-ЯЁ][а-яё]+(?:вич|вна|ична|оглы|кызы)[ \t]*(?=\n))?)'
    scan:
      anchor: ["(фамилия, имя, отчество)", "фамилия, имя, отчество"]
      region: {dy0: -2.6, dy1: 0.05, x0: 0.16, x1: 0.97}

  domains:
    title: Домен(ы)
    llm: >-
      Все домены, права на которые передаются, — каждый отдельным элементом, как написан (с зоной: .ru, .рф, .com, .рус …). Домен, разорванный переносом строки, собери в один элемент. Не включай адреса e-mail, сайты из контактов и слова, похожие на домены, вне списка передаваемых доменов.
    type: domains
    text:
      - '(?is)администрированию\s+домен[а-я()]*\s*(.+?)(?:\(наименование|и\s+предоставляемых|новому\s+Администратор)'
    scan:
      anchor: ["(наименование домена(ов)", "наименование домена"]
      region: {dy0: -1.6, dy1: 0.05, x0: 0.16, x1: 0.97}
      # длинный список на нескольких строках: абзац от этой строки до подписи поля распознаётся ещё раз
      # отдельно — как есть и без подчёркиваний (application._reread_domain_list)
      block_start: ["прошу передать права по администрированию домена(ов)", "по администрированию домена"]

  services:
    title: Дополнительные услуги
    llm: >-
      Какие дополнительные услуги передаются вместе с доменами — то, что заявитель вписал после «и предоставляемых по этим доменам дополнительных услуг (при необходимости)»: «все», «хостинг» и т. п. Печатная подсказка бланка «(Primary, Secondary DNS)» — не значение. Ничего не вписано — пусто.
    type: services
    text:
      - '(?is)\(при\s+необходимости\)\s*(.+?)\s*(?:\(Primary|новому\s+Администратору)'
      - '(?is)(и\s+предоставляемых\s+по\s+эт[а-я]+\s+домен[а-я]+\s+(?:всех|все)[^\n]*)'
    scan:
      anchor: ["(Primary, Secondary DNS)"]
      region: {dy0: -1.6, dy1: 0.05, x0: 0.16, x1: 0.97}

  new_admin_inline:
    title: Новый администратор (в тексте)
    llm: >-
      Новый администратор, если он записан прямо в строке «новому Администратору: …» после двоеточия (ФИО, часто в дательном падеже, или организация) — даже если ниже есть ещё и таблица с его данными. Если в этой строке после двоеточия ничего нет или только мусор — пусто.
    type: fio_or_org
    text:
      - '(?m)новому[ \t]+Администратору[ \t]*[:：][ \t]*([^\n]+?)[ \t]*$'

  new_admin_org:
    title: Новый администратор — юрлицо
    llm: >-
      Новый администратор — юридическое лицо: наименование организации (ООО, АО …) без ИНН, ОГРН и адреса. Если новый администратор — физлицо или ИП, пусто.
    type: org
    text:
      - '(?s)Наименование\s*\n?\s*юр\.?\s*лица\s*\|?\s*(.*?)\s*(?:[eе]\s*-?\s*\w{2,5}\s*/\s*тел|\n[^\n]*@|Для\s+физ)'
    scan:
      anchor: ["Наименование юр.лица"]
      region: {dy0: -0.4, dy1: 1.4, x0: 0.36, x1: 0.95}

  new_admin_org_contact:
    title: Контакты юрлица
    llm: >-
      E-mail и телефон нового администратора-юрлица (из строки организации или таблицы). Нет — пусто.
    type: contact
    text:
      - '(?s)юр\.?\s*лица.*?e-?mail/тел\.?\s*(.*?)\s*Для\s+физ'
      - '(?s)Наименование\s*\n?\s*юр\.?\s*лица(?:(?!Для\s+физ).)*?\n([^\n]*@[^\n]*)'

  new_admin_fio:
    title: Новый администратор — физлицо/ИП
    llm: >-
      Новый администратор — физическое лицо или ИП: ФИО (вместе с «ИП», если так написано). Если новый администратор — организация, пусто.
    type: fio_or_org
    text:
      - '(?s)Для\s+физ\.?\s*лиц\s+и\s+ИП:?\s*ФИО\s*(.*?)\s*e-?mail'
    scan:
      anchor: ["Для физ.лиц и ИП:"]
      region: {dy0: 1.0, dy1: 3.4, x0: 0.36, x1: 0.95}

  new_admin_contact:
    title: Контакты нового администратора
    llm: >-
      E-mail и телефон нового администратора-физлица или ИП. Нет — пусто.
    type: contact
    text:
      - '(?s)Для\s+физ\.?\s*лиц.*?e-?mail/тел\.?\s*(.*?)\s*Номер\s+договора'
    scan:
      anchor: ["Для физ.лиц и ИП:"]
      region: {dy0: 3.0, dy1: 5.4, x0: 0.36, x1: 0.95}

  contract:
    title: Номер договора / аккаунт нового администратора
    llm: >-
      Номер договора или название аккаунта (профиля) нового администратора / партнёра в РЕГ.РУ (после «Номер договора …» или «профиля):», бывает «Договор № …»).
    type: text
    text:
      - '(?s)профиля\)\s*:\s*(.*?)\s*(?:\(номер договора|_{5,}|\n\s*\n)'
      - '(?m)профиля\)\s*:\s*([^\n]+)'
      - '(?im)Номер\s+договора[^:\n]{0,80}:\s*([^\n]+)'
      - '(?m)^\s*(Договор\s*№\s*\d[^\n]*)'
    scan:
      anchor: ["(номер договора с компанией РЕГ.РУ)"]
      region: {dy0: -2.0, dy1: 0.1, x0: 0.26, x1: 0.97}
      clip: false   # значение на одной строке с печатным «профиля):»

  signature_fio:
    title: ФИО у подписи
    llm: >-
      ФИО заявителя у его подписи в конце заявления (обычно «/ Фамилия И. О. /» или «/Фамилия Имя Отчество/» перед «(подпись)»). Только фамилия с инициалами или ФИО заявителя — не нотариуса и не других лиц, не дата, не росчерк, не мусор распознавания; не переписывай сюда ФИО из «Я, …». Нет — пусто.
    type: fio
    text:
      - '/\s*([А-ЯЁ][А-Яа-яЁё\-]+(?:\s+[А-ЯЁ][\.А-Яа-яЁё\-]*){1,2})\s*/?\s*\n?\s*\(подпись\)'
      - '/\s*([А-ЯЁ][А-Яа-яЁё\-]+\s+[А-ЯЁ]\.\s?[А-ЯЁ]\.?)\s*/'
    scan:
      anchor: ["(ФИО)"]
      region: {dy0: -2.6, dy1: 0.05, x0: 0.46, x1: 1.0}

  application_date:
    title: Дата заявления
    llm: >-
      Дата заявления у подписи в конце (часто прописью: «двенадцатое сентября две тысячи двадцать шестого года» или цифрами). Не дата рождения и не дата выдачи паспорта.
    type: date_words
    text:
      - '(?s)\(ФИО\)\s*(.+?)\s*\(дата прописью\)'
      - '(?s)\n([^\n]*\S[^\n]*)\n\s*\(дата прописью\)'
    scan:
      anchor: ["(дата прописью)"]
      region: {dy0: -2.2, dy1: 0.05, x0: 0.1, x1: 0.6}
