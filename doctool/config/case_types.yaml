# Типы заявлений и правила вердикта.
#
# Для каждого типа:
#   title    — название в интерфейсе;
#   form     — id бланка из forms/*.yaml (null — бланк ещё не настроен);
#   enabled  — показывать ли тип как доступный;
#   needs_passport — нужен ли паспорт для проверки;
#   checks   — какие проверки выполнять (id из реестра doctool/checks.py; список с описаниями:
#              python -m doctool validate --list). Порядок в отчёте — порядок реестра, не этого списка.
#              Без списка: тип с бланком — все проверки, тип без бланка — только паспорт и данные из системы;
#   rules    — правила вердикта, проверяются сверху вниз:
#     reject — любое сработавшее правило → «Отклонить» (причины собираются все);
#     review — любое сработавшее правило → «Ручная проверка»;
#     иначе  → «Принять».
#
# Условия (when):
#   check: <название проверки> + status: [fail, warn, review, ok, info] — статус конкретной проверки
#   any_status: [...]          — у любой проверки такой статус
#   missing: <ключ поля>       — поле заявления пустое
#   flag: <имя>                — служебный признак (old_passport, admin_mismatch)
#                                admin_mismatch ставится и по данным Sd доменов из manager (ФИО/дата рождения
#                                администратора в Sd не совпадают с паспортом заявителя)
#
# Списки условий в when — все должны выполниться (И). Несколько правил — ИЛИ.
# Правило check: срабатывает, только если проверка включена в checks этого типа; опечатки в названиях
# проверок, флагов и статусов находит python -m doctool validate.
# ВНИМАНИЕ: правила ниже — стартовый вариант, их нужно сверить с регламентом.

case_types:
  admin_change_person:
    title: Смена администратора домена (физлицо → другое лицо)
    form: regru_transfer_person
    enabled: true
    needs_passport: true
    checks:
      # сверка с паспортом
      - fio_header               # ФИО в шапке («от …»)
      - fio_text                 # ФИО в тексте («Я, …»)
      - fio_signature            # ФИО у подписи
      - birth_date               # Дата рождения
      - passport_number          # Серия и номер паспорта
      - passport_issue_date      # Дата выдачи паспорта
      - issued_by                # Кем выдан
      - issuer_region            # Кем выдан ↔ код подразделения
      - series_year              # Серия ↔ год выдачи
      - mrz                      # MRZ паспорта
      - passport_loaded          # Паспорт приложен (без паспорта — ручная проверка)
      - address                  # Адрес регистрации
      # само заявление
      - fio_header_vs_text       # ФИО: шапка ↔ «Я, …»
      - inn                      # ИНН ИП: контрольные цифры
      - domains                  # Домен(ы)
      - new_admin                # Новый администратор указан
      - new_admin_text_vs_table  # Новый администратор: текст ↔ таблица
      - new_admin_not_applicant  # Новый администратор ≠ заявитель
      - new_admin_contact        # Контакты нового администратора
      - contract                 # Договор/аккаунт нового администратора
      - application_date         # Дата заявления
      # прежний паспорт, данные из системы и manager
      - old_passport             # Указан прежний паспорт (флаг old_passport)
      - system_admin             # Заявитель — текущий администратор и др. (флаг admin_mismatch)
      - manager_domains          # Домены в manager, администратор в Sd (флаг admin_mismatch)
    rules:
      reject:
        - when: {flag: old_passport}
          reason: В заявлении указан прежний (недействительный) паспорт
        - when: {check: "Серия и номер паспорта", status: [fail]}
          reason: Серия и номер паспорта не совпадают с предъявленным паспортом
        - when: {check: "ФИО в шапке («от …»)", status: [fail]}
          reason: ФИО заявителя не совпадает с паспортом
        - when: {check: "Дата рождения", status: [fail]}
          reason: Дата рождения не совпадает с паспортом
        - when: {flag: admin_mismatch}
          reason: Заявитель не является текущим администратором домена
        - when: {check: "Домен(ы)", status: [fail]}
          reason: Домен не указан или указан некорректно
        - when: {check: "Новый администратор указан", status: [fail]}
          reason: Не указан новый администратор
        - when: {check: "Новый администратор ≠ заявитель", status: [fail]}
          reason: Новый администратор совпадает с заявителем
        - when: {check: "Дата заявления", status: [fail]}
          reason: Дата заявления в будущем
      review:
        - when: {check: "Паспорт приложен", status: [review]}
          reason: Паспорт не загружен — сверка с паспортом не выполнялась
        - when: {check: "Домен(ы)", status: [review]}
          reason: Список доменов нужно сверить с заявлением — не сошлось число доменов, есть обрывки имён или разночтения
        - when: {check: "Домены в manager", status: [fail]}
          reason: Домен из заявления не найден в manager — см. WHOIS в таблице доменов
        - when: {check: "Домены в manager", status: [review]}
          reason: Данные доменов из manager получены не полностью
        - when: {check: "Заявитель — администратор доменов (Sd)", status: [review]}
          reason: Данные администратора в Sd нужно сверить вручную
        - when: {check: "Администратор у доменов один", status: [warn]}
          reason: У доменов из заявления разные администраторы
        - when: {any_status: [review]}
          reason: Есть поля, которые нужно подтвердить вручную
        - when: {any_status: [warn, fail]}
          reason: Есть замечания — см. таблицу проверок

  lk_owner_change:
    title: Смена владельца личного кабинета
    form: null
    enabled: false
    needs_passport: true

  admin_data_update:
    title: Изменение паспортных данных администратора
    form: null
    enabled: false
    needs_passport: true

  passport_only:
    title: Только проверка паспорта
    form: null
    enabled: true
    needs_passport: true
    checks: [issued_by, issuer_region, series_year, mrz, system_admin, manager_domains]
    rules:
      reject:
        - when: {flag: admin_mismatch}
          reason: Владелец паспорта не является текущим администратором домена
      review:
        - when: {check: "Кем выдан", status: [review, warn]}
          reason: «Кем выдан» нужно подтвердить по паспорту
        - when: {check: "Кем выдан ↔ код подразделения", status: [review, warn]}
          reason: Регион органа выдачи не совпадает с кодом подразделения
        - when: {check: "Кем выдан ↔ данные системы", status: [review, warn]}
          reason: «Кем выдан» отличается от данных во внутренней системе
        - when: {check: "Домены в manager", status: [fail]}
          reason: Домен из заявления не найден в manager — см. WHOIS в таблице доменов
        - when: {check: "Домены в manager", status: [review]}
          reason: Данные доменов из manager получены не полностью
        - when: {check: "Заявитель — администратор доменов (Sd)", status: [review]}
          reason: Данные администратора в Sd нужно сверить вручную
        - when: {check: "Администратор у доменов один", status: [warn]}
          reason: У доменов из заявления разные администраторы
        - when: {any_status: [review, warn, fail]}
          reason: Есть поля, которые нужно подтвердить вручную
